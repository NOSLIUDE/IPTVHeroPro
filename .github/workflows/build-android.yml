name: Build Android Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4096m -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Xmx4096m"

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cria o gradlew automaticamente caso não esteja no repositório
      - name: Auto-generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper não encontrado. A gerar automaticamente..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          fi

      # 4. Garante permissão de execução ao script do Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Configura o AndroidX e limites de memória no gradle.properties
      - name: Configure gradle.properties for memory and AndroidX
        run: |
          PROPERTIES_FILE="gradle.properties"
          if [ ! -f "$PROPERTIES_FILE" ]; then
            touch "$PROPERTIES_FILE"
          fi
          if ! grep -q "android.useAndroidX=true" "$PROPERTIES_FILE"; then
            echo "android.useAndroidX=true" >> "$PROPERTIES_FILE"
          fi
          if ! grep -q "android.enableJetifier=true" "$PROPERTIES_FILE"; then
            echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"
          fi
          if ! grep -q "org.gradle.jvmargs" "$PROPERTIES_FILE"; then
            echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> "$PROPERTIES_FILE"
          fi
          if ! grep -q "org.gradle.workers.max" "$PROPERTIES_FILE"; then
            echo "org.gradle.workers.max=2" >> "$PROPERTIES_FILE"
          fi

      # 6. Compila o APK em modo Debug com limite de workers e stacktrace
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace

      # 7. Salva o APK gerado como artefato para download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
