name: Build Android App (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configurar Node.js para projetos web/Capacitor
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 2. Instalar dependências do projeto e gerar build web
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      # 3. Configurar Java JDK 17 (necessário para o Android moderno)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Sincronizar o projeto com a plataforma Android do Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 5. Dar permissão ao gradlew dentro da pasta android e compilar o APK
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. Salvar o APK gerado como artefato
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          
