name: Build Android App (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar o build manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Node.js (sem exigir package-lock.json)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Instala as dependências web e gera o build do projeto
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      # 4. Configura o Java JDK 17 para o Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 5. Sincroniza os arquivos web com a plataforma nativa Android (Capacitor)
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 6. Dá permissão e compila o APK de Debug via Gradle
      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Salva o APK gerado como artefato para download no GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
