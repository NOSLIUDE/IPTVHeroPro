name: Build Android Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar o build manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Java JDK 17 (padrão para o Android moderno)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Dá permissão de execução para o script do Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Compila o APK em modo Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Salva o APK gerado como artefato para download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          
