name: Build Android Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cria o gradlew automaticamente se ele estiver faltando no repositório
      - name: Auto-generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper não encontrado. A gerar automaticamente..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          fi

      # 4. Garante permissão de execução
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Compila o APK em modo Debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Salva o APK gerado como artefato para download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
